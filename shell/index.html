<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- a interface não aceita zoom (pinça): quem quiser zoom (Fotos) faz o seu -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>LUMNA</title>
    <!-- Abertura das janelas de app (como no Android): fundo do LUMNA, o ícone e o nome do app no
         meio, enquanto o WebKit carrega. O Rust põe o app em window.__LUMNA_APP
         (initialization_script). O Vue substitui o #app ao montar. -->
    <style>
      .lumna-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; background: #08060f; color: #ece8ff; font: 500 17px Inter, sans-serif; }
      .lumna-splash span { width: 92px; height: 92px; display: grid; place-items: center; border-radius: 28px;
        background: rgba(139, 92, 246, 0.18); color: #b9a2fb; animation: lumna-in 0.4s ease-out both, lumna-pulse 1.6s 0.4s ease-in-out infinite; }
      .lumna-splash p { margin: 0; opacity: 0.85; animation: lumna-in 0.4s 0.08s ease-out both; }
      @keyframes lumna-in { from { opacity: 0; transform: scale(0.85); } }
      @keyframes lumna-pulse { 50% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0.08); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        // sem zoom de pinça nem Ctrl+roda (o touchpad do PC manda a pinça assim)
        var block = function (e) { e.preventDefault(); };
        document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturestart", block, { passive: false });
        document.addEventListener("gesturechange", block, { passive: false });
        document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

        var info = window.__LUMNA_APP;
        if (!info) return;
        var icons = {
          settings: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z",
          files: "M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
          phone: "M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2",
          remote: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM10 8.5v7l5.5-3.5z",
          store: "M12 4v11M7 10l5 5 5-5M5 20h14",
          installer: "M12 4v11M7 10l5 5 5-5M5 20h14",
          sparkle: "M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z",
          image: "M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z",
        };
        document.documentElement.style.background = "#08060f";
        var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
        document.getElementById("app").innerHTML =
          '<div class="lumna-splash"><span><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' +
          (icons[info.icon] || icons.sparkle) + '"/></svg></span><p>' + esc(info.name) + "</p></div>";
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
