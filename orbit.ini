# Copia para ~/.config/orbit/orbit.ini
# ou aponta com ORBIT_CONFIG. ORBIT_GAP, ORBIT_MASTER,
# ORBIT_PHONE_SCALE e ORBIT_TERMINAL ganham ao ficheiro.
# Um atalho vazio ou "-" desliga essa acção.

[geral]
intervalo = 8
mestre = 56
escala = 2
fundo = #101312
borda = #8BA899
borda_px = 1
arranjo = mestre
animacao = 120
terminal = foot
captura = grim
volume_subir = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
volume_descer = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
brilho_subir = brightnessctl set 5%+
brilho_descer = brightnessctl set 5%-
lancador = pkill -x lumna-lancador || lumna-lancador
# aninhado num Wayland de fora: pedir a ele que deixe o Super para o Orbit (sim | nao)
inibir_atalhos = sim
seletor_midia = lumna-midia tela seletor
# o microfone da Emma (o mesmo atalho encerra a fala e transcreve)
emma = lumna-emma ouvir
modo_seletor = lumna-modos

[atalho]
terminar = Alt+Escape
terminal = Alt+Return
fechar = Alt+q
flutuar = Alt+space
ecra = Alt+f
dividir = Alt+s
foco_seguinte = Alt+j
foco_anterior = Alt+k
mestre_menos = Alt+h
mestre_mais = Alt+l
alternar = Alt+Tab
alternar_voltar = Alt+Shift+Tab
minimizar = Super+h
modo = Super+Tab
modo_anterior = Super+Shift+Tab
# o Super sozinho (carregar e soltar)
lancador = Super
seletor_midia = Super+M
emma = Super+A
trocar_telas = Super+Shift+O
saida_esquerda = Alt+Left
saida_direita = Alt+Right
espaco_1 = Alt+1
espaco_2 = Alt+2
espaco_3 = Alt+3
espaco_anterior = Ctrl+Alt+Left
espaco_seguinte = Ctrl+Alt+Right
mover_1 = Alt+Shift+1
mover_2 = Alt+Shift+2
mover_3 = Alt+Shift+3
captura = -
volume_subir = -
volume_descer = -
brilho_subir = -
brilho_descer = -
