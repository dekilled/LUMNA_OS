# Wi-Fi do OnePlus 6T (WCN3990, ath10k_snoc): o firmware roda dentro do modem e cai quando a
# placa entra e sai da economia de energia ("Asserted in wlan_vdev.c:_wlan_vdev_down"); a
# recuperação do modem às vezes falha ("port failed halt") e o aparelho vai pro crashdump.
# Sem economia de energia e sem trocar o MAC a cada busca, ela fica bem mais estável.
[connection]
wifi.powersave = 2

[device]
wifi.scan-rand-mac-address = no
