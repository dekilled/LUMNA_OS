# OnePlus 6T (fajita) - SDM845 - kernel mainline (sem Halium)
# Fonte dos valores: pmaports device/community/device-oneplus-fajita (postmarketOS)
DEVICE_NAME="OnePlus 6T"
DEVICE_ARCH=aarch64
DEVICE_METHOD=mainline

# pmaports fixado num commit para o build ser reproduzível
PMAPORTS_REF=dc3b31fbf84d9f02adb5c3fce63752b181231c85

KERNEL_TAG=sdm845-7.1-rc1-r0
KERNEL_URL="https://gitlab.com/sdm845-mainline/linux/-/archive/$KERNEL_TAG/linux-$KERNEL_TAG.tar.gz"
KERNEL_CONFIG=device/community/linux-postmarketos-qcom-sdm845/config-postmarketos-qcom-sdm845.aarch64
KERNEL_DTB=qcom/sdm845-oneplus-fajita
KERNEL_IMAGE=Image.gz
KERNEL_FRAGMENT=lumna.config

# boot.img (header v0, kernel Image.gz com dtb anexado)
BOOT_HEADER_VERSION=0
BOOT_PAGESIZE=4096
BOOT_BASE=0x00000000
BOOT_KERNEL_OFFSET=0x00008000
BOOT_RAMDISK_OFFSET=0x01000000
BOOT_SECOND_OFFSET=0x00f00000
BOOT_TAGS_OFFSET=0x00000100
# ttyMSM0 contorna uma corrida na inicialização do display (drm/msm#46)
BOOT_CMDLINE="console=ttyMSM0,115200 console=tty0"

# Módulos que o initramfs carrega (os embutidos no kernel são ignorados)
# (msm, painel s6e3fc2x01, dwc3 e PHYs USB já vêm embutidos no kernel)
INITFS_MODULES="rmi_core rmi_i2c qcom_spmi_haptics libcomposite usb_f_ncm"

# Firmware proprietário (blobs extraídos do aparelho pelo time sdm845-mainline)
FIRMWARE_GIT=https://gitlab.com/sdm845-mainline/firmware-oneplus-sdm845.git
FIRMWARE_REF=3e31a0c3e5a061645c09f805387b49fa9d35acbf
FIRMWARE_URL="https://gitlab.com/sdm845-mainline/firmware-oneplus-sdm845/-/archive/$FIRMWARE_REF/firmware-oneplus-sdm845-$FIRMWARE_REF.tar.gz"
# GPU precisa disto já no initramfs (junto com o msm)
INITFS_FIRMWARE="qcom/a630_gmu.bin qcom/a630_sqe.fw qcom/sdm845/OnePlus/enchilada/a630_zap.mbn"

# Partições A/B: dá pra testar no slot inativo sem apagar o Android
BOOT_SLOTS=ab

# rootfs vai na partição userdata (apaga o Android!), UFS usa setor de 4096
ROOTFS_PARTITION=userdata
ROOTFS_BLOCKSIZE=4096
ROOTFS_SIZE=6G
