# Lenovo Z5 Pro GT (heart, L78032) - SM8150 (Snapdragon 855) - ALVO PRINCIPAL
# Kernel 4.14 downstream do LineageOS oficial (device/lenovo/heart + sm8150-common).
# ATENÇÃO: o systemd atual do Arch exige kernel >= 5.10. Este kernel serve pro primeiro boot
# (initramfs + shell pela USB) e pra estudar o hardware; o Arch completo vai precisar de mainline
# ou de um init sem systemd. Fontes mainline SM8150 (mesma comunidade):
#   gitlab.postmarketos.org/soc/qualcomm-sm8150/linux   mais aparelhos (raphael, guacamole, vayu...)
#   github.com/sm8150-mainlining/linux                  staging; ex.: painel e dts do LG V50, áudio slimbus
# Hardware do heart a portar: touch Goodix GT9889 (família GTX8, sem driver mainline),
# codec Cirrus CS47L35 (madera, tem driver mainline), painel AMOLED 1080x2340 via DSI.
DEVICE_NAME="Lenovo Z5 Pro GT (heart)"
DEVICE_ARCH=aarch64
DEVICE_METHOD=downstream

KERNEL_GIT=https://github.com/Lucchetto/android_kernel_lenovo_sm8150
KERNEL_REF=839377846d192a2290388a187dde720412c3c45b   # lineage-24.0, 2026-09-19
KERNEL_TAG=lenovo-sm8150-${KERNEL_REF%"${KERNEL_REF#???????}"}
# Mesma ordem do BoardConfig do Lineage, mais o nosso fragmento
KERNEL_DEFCONFIGS="vendor/sm8150-perf_defconfig vendor/lenovo/sm8150-common.config vendor/lenovo/heart.config"
KERNEL_FRAGMENT=lumna.config
# Image-dtb = cabeçalho + Image + todos os dtbs; o bootloader escolhe o certo.
# O dtbo fica na partição dtbo do Lineage (mesmo kernel, então é compatível).
KERNEL_IMAGE=Image-dtb
# o dtc embutido no 4.14 não entende os overlays; o Lineage também usa um dtc externo
KERNEL_MAKE_ARGS="DTC_EXT=dtc"

# boot.img: BoardConfigCommon.mk do sm8150-common (lineage-23.2)
BOOT_HEADER_VERSION=1
BOOT_PAGESIZE=4096
BOOT_BASE=0x00000000
BOOT_KERNEL_OFFSET=0x00008000
BOOT_RAMDISK_OFFSET=0x01000000
BOOT_SECOND_OFFSET=0x00f00000
BOOT_TAGS_OFFSET=0x00000100
BOOT_CMDLINE="androidboot.hardware=qcom androidboot.usbcontroller=a600000.dwc3 earlycon=msm_geni_serial,0xa90000 swiotlb=2048 loop.max_part=7"

# Aparelho não-A/B: a partição recovery (TWRP/SHRP) continua lá como rede de segurança
INITFS_MODULES=""
INITFS_FIRMWARE=""
