name: Pacotes da UI nova

# A cada push na branch iso-orbit: compila os pacotes da sessão nova (Orbit, Gravity, sessão, clássico e Emma), confere e PUBLICA
# no repositório [lumna] do canal novo (a release "repo-orbit"). É de lá que o sistema instalado atualiza: "Atualizar tudo" no
# Painel (Sobre > Atualizações do sistema) ou pacman -Syu. Leva uns minutos, bem menos que montar a ISO (iso.yml).
on:
  push:
    branches: [iso-orbit]
  workflow_dispatch:

permissions:
  contents: write

# duas publicações ao mesmo tempo se pisariam no banco do repositório: uma espera a outra
concurrency:
  group: repo-orbit
  cancel-in-progress: false

jobs:
  pacotes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    steps:
      - name: Ferramentas
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo libxml2 libarchive github-cli
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Compila, confere e publica (repo-orbit)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LUMNA_CANAL: -orbit
          PUBLICAR: "1"
        run: ./scripts/publica-repo.sh
