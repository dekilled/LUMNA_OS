name: ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Monta o ISO (pacotes, validação da config, mkarchiso)
        run: ./scripts/build-iso.sh

      - name: Checksum
        run: cd out && sha256sum lumna-os-*.iso > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lumna-os-iso
          path: |
            out/lumna-os-*.iso
            out/SHA256SUMS
          retention-days: 7
          compression-level: 0

      - name: Publica na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/lumna-os-*.iso
            out/SHA256SUMS
