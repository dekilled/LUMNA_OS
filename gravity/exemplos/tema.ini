# Um tema do Gravity. Copie para ~/.config/gravity/tema.ini (ou aponte GRAVITY_TEMA para ele)
# e mude o que quiser; o que não estiver aqui fica como o do LUMNA. As cores aceitam o nome do
# campo (acento) ou o do token do design (accent).

[cores]
accent = #f472b6
accent-hover = #f68fc6
accent-pressed = #d95c9e
focus = #f9a8d4
# surface = #14121D
# text = #F4F1FA

[forma]
raio_grande = 16
raio_medio = 10
raio_pequeno = 8
# espaco = 4
# traco_icone = 1.8

[texto]
fonte = Inter, Noto Sans, sans-serif
tamanho_corpo = 16
tamanho_titulo = 24

[movimento]
duracao_normal = 260
curva = mola
animacoes = sim
