[workspace]
resolver = "2"
members = ["crates/lumna-core", "crates/lumna-hypr", "shell/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
lumna-core = { path = "crates/lumna-core" }
lumna-hypr = { path = "crates/lumna-hypr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
