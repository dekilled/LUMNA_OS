# Os portais da sessão LUMNA · Orbit (XDG_CURRENT_DESKTOP=LUMNA): o wlr para compartilhar tela (o Orbit tem o
# wlr-screencopy) e o GTK para o resto (escolher arquivo, abrir link, impressão...).
[preferred]
default=gtk
# o seletor de arquivos (abrir, enviar, salvar, escolher pasta) é o do Atlas (lumna-portal)
org.freedesktop.impl.portal.FileChooser=lumna
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
