# A animação de boot (Plymouth) fica na tela até a tela de login aparecer: antes do Orbit do login ela solta a placa de vídeo, e depois que o greetd
# sobe ela sai deixando o último quadro (o Orbit o cobre ao desenhar o primeiro). Sem o Plymouth ativo estes comandos não fazem nada.
[Unit]
After=plymouth-start.service

[Service]
ExecStartPre=-/usr/bin/plymouth deactivate
ExecStartPost=-/usr/bin/plymouth quit --retain-splash
