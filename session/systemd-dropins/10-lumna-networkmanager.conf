# A rede do LUMNA é do NetworkManager (o Painel > Rede e a mesclagem de conexões falam com ele). Este serviço também pedia DHCP na mesma placa: a placa ficava com
# DOIS IPs e duas rotas padrão, e o roteador (que associa IP e MAC) passava a limitar ou descartar parte do tráfego: páginas e vídeos que carregam e depois travam
# (o Eric, 2026-11-16). Aqui ele só sobe se a pessoa pedir de propósito: sudo mkdir -p /etc/lumna && sudo touch /etc/lumna/permitir-networkd-iwd
[Unit]
ConditionPathExists=/etc/lumna/permitir-networkd-iwd
