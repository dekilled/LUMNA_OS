# LUMNA OS: arquivos de sistema que a sessão de cada pessoa atualiza.
# /var/lib/lumna/monitors: ordem das telas (Configurações → Telas) para a tela de login usar também.
# Só dados ("NOME X Y ESCALA" por linha); a tela de login confere cada campo antes de usar.
d /var/lib/lumna 0755 root root -
f /var/lib/lumna/monitors 0666 root root -
